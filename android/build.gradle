group = "br.com.jylabtech.zoop_payment_tech"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/getzoop/zoop-package-public")
            credentials {
                username = project.findProperty("GITHUB_USER") ? project.findProperty("GITHUB_USER").toString() : (System.getenv("GITHUB_USER") ?: "")
                password = project.findProperty("GITHUB_PAT") ? project.findProperty("GITHUB_PAT").toString() : (System.getenv("GITHUB_PAT") ?: "")
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "br.com.jylabtech.zoop_payment_tech"

    compileSdk = 34
    
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 23
        
        // Licença - pode ser configurada via local.properties ou variáveis de ambiente
        def localProps = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localProps.load(new FileInputStream(localPropertiesFile))
        }
        
        def licenceKey = System.getenv("LICENCE_KEY") ?: localProps.getProperty("licenceKey") ?: ""
        def licenceInternalKey = System.getenv("LICENCE_INTERNAL_KEY") ?: localProps.getProperty("licenceInternalKey") ?: ""
        
        buildConfigField "String", "LICENCE_KEY", "\"${licenceKey}\""
        buildConfigField "String", "LICENCE_INTERNAL_KEY", "\"${licenceInternalKey}\""
    }

    flavorDimensions += "terminal"

    productFlavors {
        register("paxA910") {
            dimension = "terminal"
        }
        register("gertecGpos720") {
            dimension = "terminal"
        }
        register("tectoyT4") {
            dimension = "terminal"
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // Zoop SDK - Terminal específicos
    "tectoyT4Implementation"("br.zoop.pos.plugin:smartpos-tectoy-t4:1.12.11")
    "paxA910Implementation"("br.zoop.pos.plugin:smartpos-pax-a910:1.12.11")
    "gertecGpos720Implementation"("br.zoop.pos.plugin:smartpos-gertec-gpos720:1.12.11")
    "gertecGpos720Implementation"("org.slf4j:slf4j-api:1.7.25")
    "gertecGpos720Implementation"("com.github.tony19:logback-android:2.0.0")

    // Kotlin
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.25")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4")

    // AndroidX Security
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    // AndroidX
    implementation("androidx.core:core-ktx:1.9.0")
    implementation("androidx.appcompat:appcompat:1.6.1")

    // Desugaring
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:1.1.5")

    // Test
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
